name: Contribution snake

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draw contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=%23719652&color_dots=%23ebedf0,%23c9e8b5,%239cc67e,%23719652,%23476535
            assets/snake-dark.svg?palette=github-dark&color_snake=%23c9f3ad&color_dots=%23161f19,%23314d36,%2357794f,%2387b371,%23c9f3ad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution snake'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
